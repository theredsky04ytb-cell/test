# Configuration Netlify
[build]
  publish = "."                       # le site est à la racine (index.html, admin.html…)
  functions = "netlify/functions"     # API de l'espace admin

[build.environment]
  NODE_VERSION = "22"
  # Le mot de passe admin est volontairement une variable Netlify (jamais dans les fichiers) :
  # on évite que l'analyse anti-secrets ne bloque le build si une suite de caractères du mot de passe
  # ressemble par hasard à un mot présent dans le code.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_PASSWORD,SESSION_SECRET"

# /admin  →  admin.html  (l'adresse reste /admin)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200

# Images statiques (dossier ./images) : cache longue durée
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Le service worker doit toujours être revérifié (sinon les mises à jour du site tardent à arriver)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Plan du site : adresse à donner à Google Search Console = https://steady-moxie-bc7519.netlify.app/api/sitemap
# (rien à configurer ici : il est généré automatiquement par l'API)

# L'admin ne doit jamais être indexé par Google
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
